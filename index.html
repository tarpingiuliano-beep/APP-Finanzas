<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<title>Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --line: #ece7e0;
    --text: #3b3a38; --muted: #8c8780;
    --blue: #d6e6f2; --green: #d7ecdc; --rose: #f4dcdc; --sand: #f1e8d8;
    --ok: #4f8a63; --bad: #b86a6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 96px; }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .row span:first-child { color: var(--muted); }
  .big { text-align: center; padding: 22px 16px; border-radius: 16px; margin-bottom: 14px; }
  .big small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .big b { font-size: 30px; font-weight: 600; }
  .pos { background: var(--green); } .pos b { color: var(--ok); }
  .neg { background: var(--rose); } .neg b { color: var(--bad); }
  h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 22px 4px 8px;
    text-transform: uppercase; letter-spacing: .04em; }
  .venc { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .venc:last-child { border-bottom: 0; }
  .venc small { display: block; color: var(--muted); font-size: 12px; }
  .pill { background: var(--blue); border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }
  .pill.hoy { background: var(--rose); }
  .vacio { color: var(--muted); font-size: 14px; text-align: center; padding: 10px 0; }
  .mes { display: grid; grid-template-columns: 52px 1fr 86px; align-items: center; gap: 10px;
    font-size: 13px; padding: 5px 0; }
  .mes .bar { height: 10px; background: var(--sand); border-radius: 6px; overflow: hidden; }
  .mes { cursor: pointer; border-radius: 8px; }
  .mes.sel { background: var(--bg); }
  .mes .bar i { display: block; height: 100%; background: #b9d3e6; border-radius: 6px; }
  .mes span:last-child { text-align: right; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 14px 0; font-size: 14px;
    color: var(--muted); font-family: inherit; }
  nav button.on { color: var(--text); font-weight: 600; background: var(--sand); }
  .login { max-width: 340px; margin: 18vh auto 0; padding: 0 20px; text-align: center; }
  .login input { width: 100%; padding: 13px 14px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); margin-bottom: 12px; }
  .login button { width: 100%; padding: 13px; font-size: 16px; border: 0; border-radius: 12px;
    background: var(--blue); color: var(--text); font-family: inherit; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 10px; }
  .hidden { display: none; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top button { border: 0; background: none; color: var(--muted); font-size: 13px; font-family: inherit; }
  .seg { display: flex; background: var(--sand); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px 0; border-radius: 9px; font-size: 14px; color: var(--muted); font-family: inherit; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; }
  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 12px; color: var(--muted); margin: 0 4px 4px; }
  .campo input, .campo select { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--text); font-family: inherit; }
  .btn { width: 100%; padding: 13px; font-size: 16px; border: 0; border-radius: 12px; background: var(--blue);
    color: var(--text); font-family: inherit; }
  .btn:disabled { opacity: .5; }
  .nota { color: var(--muted); font-size: 13px; margin: 2px 4px 14px; min-height: 18px; }
  .btn2 { display: block; text-align: center; margin-top: 10px; background: var(--card); border: 1px solid var(--line); }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .item .fila { display: flex; gap: 8px; }
  .item .fila > * { flex: 1; min-width: 0; }
  .item .acc { display: flex; gap: 8px; margin-top: 10px; }
  .item .acc button { flex: 1; padding: 11px; font-size: 15px; border: 0; border-radius: 12px; font-family: inherit; color: var(--text); }
  .item .guardar { background: var(--green); } .item .descartar { background: var(--sand); }
  .item.hecho { opacity: .55; }
  .mini { border: 0; border-radius: 10px; padding: 8px 12px; font-size: 13px; background: var(--sand); color: var(--text); font-family: inherit; }
  .mini.ir { background: var(--blue); }
  .ok { color: var(--ok); } .mal { color: var(--bad); }
  .nav-mes { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .nav-mes b { font-weight: 600; text-transform: capitalize; }
  .dia { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; align-items: center; padding: 9px 0;
    border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .dia:last-child { border-bottom: 0; }
  .dia small { color: var(--muted); font-size: 12px; display: block; }
  .dia.finde { color: var(--muted); } .dia.edit small:first-child { color: var(--text); }
  .dia.libre { opacity: .6; }
  .edit-dia { background: var(--bg); border-radius: 12px; padding: 12px; margin: 4px 0 10px; }
  .edit-dia .acc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .chip { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; background: var(--sand); font-size: 13px; border: 0; color: var(--text); font-family: inherit; }
  .chip.on { background: var(--blue); font-weight: 600; }
  .chip.cerrado { opacity: .75; }
  .sec { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; padding: 12px 0 2px; border-top: 1px solid var(--line); margin-top: 6px; }
  .sub { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); padding: 2px 0 2px 12px; }
  .sub span:first-child { min-width: 0; }
  .tag { font-size: 11px; background: var(--sand); border-radius: 999px; padding: 2px 8px; margin-left: 6px; color: var(--muted); }
  .tilde { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; }
  .tilde input { width: 22px; height: 22px; margin-top: 1px; flex: none; }
  .tilde small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hbar { height: 10px; background: var(--sand); border-radius: 6px; overflow: hidden; }
  .hbar i { display: block; height: 100%; background: #8fb6d3; border-radius: 6px; }
  #impresion { display: none; }
  @media print {
    body > *:not(#impresion) { display: none !important; }
    #impresion { display: block !important; color: #000; background: #fff; font-size: 11px; }
    #impresion table { width: 100%; border-collapse: collapse; }
    #impresion td, #impresion th { border: 1px solid #999; padding: 3px 6px; text-align: left; }
    #impresion h1 { font-size: 16px; margin: 0 0 8px; }
    @page { size: A4; margin: 14mm; }
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1>Finanzas</h1>
  <form id="formLogin" autocomplete="on">
    <input type="text" name="username" value="finanzas" autocomplete="username" class="hidden" aria-hidden="true">
    <input type="password" id="clave" name="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  <div class="err" id="err"></div>
</div>

<div id="app" class="wrap hidden">
  <div class="top"><h1 id="titulo">Inicio</h1><button id="salir">Salir</button></div>
  <div id="vista"></div>
</div>

<nav id="nav" class="hidden">
  <button data-v="inicio" class="on">Inicio</button>
  <button data-v="deuda">Deuda</button>
  <button data-v="objetivo">Objetivo</button>
  <button data-v="horas">Horas</button>
  <button data-v="cargar">Cargar</button>
</nav>

<div id="impresion"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const money = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(Number(n || 0)).toLocaleString("es-AR", { maximumFractionDigits: 0 });
let clave = null, vistaActual = "inicio";
const cache = {};

function guardar(c) { try { sessionStorage.setItem("k", c); } catch (e) {} }
function leer() { try { return sessionStorage.getItem("k"); } catch (e) { return null; } }

async function api(accion, datos) {
  if (!window.API_URL) throw new Error("Falta configurar API_URL en config.js");
  const r = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ clave, accion, datos })
  });
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error");
  return d.data;
}

function mostrarLogin(msg) {
  $("app").classList.add("hidden"); $("nav").classList.add("hidden");
  $("login").classList.remove("hidden"); $("err").textContent = msg || "";
}

async function entrar(c) {
  clave = c;
  try {
    await cargar("inicio");
    guardar(c);
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden"); $("nav").classList.remove("hidden");
  } catch (e) { clave = null; mostrarLogin(e.message); }
}

async function cargar(v) {
  vistaActual = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("titulo").textContent = { inicio: "Inicio", deuda: "Deuda", objetivo: "Objetivo", horas: "Facturación", cargar: "Cargar" }[v];
  if (v === "cargar") { $("vista").innerHTML = htmlCargar(); return; }
  if (v === "horas") { await cargarHoras(horasMes); return; }
  const d = await api(v);
  cache[v] = d;
  if (v === "objetivo") objIdx = null;
  $("vista").innerHTML = v === "inicio" ? htmlInicio(d) : v === "objetivo" ? htmlObjetivo(d) : htmlDeuda(d);
}

function htmlInicio(d) {
  const venc = d.vencimientos.length ? d.vencimientos.map((v, i) => {
    const cuando = v.dias === 0 ? "hoy" : v.dias === 1 ? "mañana" : "en " + v.dias + " días";
    return `<div id="vf${i}"><div class="venc"><div>${esc(v.concepto)}<small>${v.fecha}</small></div>
      <div style="text-align:right">${money2(v.monto)}<br><span class="pill ${v.dias === 0 ? "hoy" : ""}">${cuando}</span>
      <button class="mini" style="margin-left:6px" onclick="editarFac(${i})">Editar</button></div></div></div>`;
  }).join("") : `<div class="vacio">Sin vencimientos cargados</div>`;
  return `
    <div class="big ${d.resultado >= 0 ? "pos" : "neg"}"><small>Resultado de ${d.mes}</small><b>${money(d.resultado)}</b></div>
    <div class="card">
      <div class="row"><span>Ingreso neto</span><span>${money(d.ingreso)}</span></div>
      <div class="row"><span>Fijos</span><span>${money(d.fijos)}</span></div>
      <div class="row"><span>Cuotas</span><span>${money(d.cuotas)}</span></div>
      <div class="row"><span>Pago único</span><span>${money(d.pagoUnico)}</span></div>
    </div>
    <div class="nota">Es lo que pagás este mes. Lo que cargues ahora entra desde el mes que viene (o el siguiente, si marcás "siguiente resumen").</div>
    ${recordatorios(d)}
    ${htmlPush()}
    <h2>Próximos vencimientos</h2>
    <div class="card">${venc}</div>`;
}

function editarFac(i) {
  const v = cache.inicio.vencimientos[i];
  $("vf" + i).innerHTML = `<div class="edit-dia">
    <div class="campo"><label>Concepto</label><input id="fC" type="text" value="${esc(v.concepto)}"></div>
    <div class="fila" style="display:flex;gap:8px">
      <div class="campo" style="flex:1"><label>Monto</label><input id="fM" type="text" inputmode="decimal" value="${v.monto}" oninput="$('fEco').textContent = money2(leerMonto(this.value))"></div>
      <div class="campo" style="flex:1"><label>Vencimiento</label><input id="fV" type="date" value="${v.iso}"></div>
    </div>
    <div class="nota" id="fEco">${money2(v.monto)}</div>
    <div class="acc"><button class="mini ir" onclick="guardarFac(${i})">Guardar</button>
      <button class="mini" onclick="borrarFac(${i})">Borrar</button>
      <button class="mini" onclick="cargar('inicio')">Cancelar</button></div></div>`;
}
async function guardarFac(i) {
  const v = cache.inicio.vencimientos[i];
  const datos = { fila: v.fila, original: v.concepto, concepto: $("fC").value.trim(), monto: leerMonto($("fM").value), vencimiento: $("fV").value };
  if (!datos.concepto || !(datos.monto > 0) || !datos.vencimiento) { $("fEco").className = "nota mal"; $("fEco").textContent = "Completá todos los campos."; return; }
  if (!confirm(`¿Guardar ${datos.concepto} por ${money2(datos.monto)}, vence el ${fechaCorta(datos.vencimiento)}?`)) return;
  try { await api("editarFactura", datos); await cargar("inicio"); } catch (e) { $("fEco").className = "nota mal"; $("fEco").textContent = e.message; }
}
async function borrarFac(i) {
  const v = cache.inicio.vencimientos[i];
  if (!confirm(`¿Borrar la factura ${v.concepto} (${money2(v.monto)})?`)) return;
  try { await api("borrarFactura", { fila: v.fila, original: v.concepto }); await cargar("inicio"); } catch (e) { alert(e.message); }
}

function recordatorios(d) {
  const r = d.recordatorios || [];
  if (!r.length) return "";
  return `<h2>Falta cargar</h2><div class="card">` + r.map((x, i) => `<div class="venc"><div>${esc(x.concepto)}<small>Último vencimiento ${fechaCorta(x.ultimoVto)}</small></div>
    <div style="display:flex;gap:6px"><button class="mini" onclick="quitarRec(${i})">Ya no</button><button class="mini ir" onclick="irCargar(${i})">Cargar</button></div></div>`).join("") + `</div>`;
}

async function irCargar(i) {
  const x = cache.inicio.recordatorios[i];
  tipoCarga = "factura";
  await cargar("cargar");
  $("cConcepto").value = x.concepto;
  $("cMonto").focus();
}

async function quitarRec(i) {
  const x = cache.inicio.recordatorios[i];
  try { await api("quitarRecordatorio", { clave: x.clave }); await cargar("inicio"); } catch (e) { alert(e.message); }
}

// ---- Avisos push en este celular ----
function pushActivo() { try { return localStorage.getItem("pushOk") === "1" && Notification.permission === "granted"; } catch (e) { return false; } }

function htmlPush() {
  if (pushActivo()) return `<div class="card" id="pushCard"><div class="row"><span>Avisos en este celular</span><span class="ok">Activados</span></div>
    <button class="mini" onclick="probarPush()">Enviar prueba</button><div class="nota" id="pushNota"></div></div>`;
  return `<div class="card" id="pushCard"><div class="row"><span>Avisos en este celular</span><span>Desactivados</span></div>
    <button class="btn" onclick="activarAvisos()">Activar avisos</button><div class="nota" id="pushNota"></div></div>`;
}

async function activarAvisos() {
  const nota = $("pushNota"); nota.className = "nota"; nota.textContent = "Activando…";
  try {
    if (!("Notification" in window) || typeof firebase === "undefined") throw new Error("Este navegador no soporta avisos.");
    if (await Notification.requestPermission() !== "granted") throw new Error("Permiso denegado. Activalo en los ajustes del sitio en Chrome.");
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const reg = await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error("No pude obtener el token del celular.");
    await api("registrarToken", { token, link: location.origin + location.pathname });
    try { localStorage.setItem("pushOk", "1"); } catch (e) {}
    escucharEnPrimerPlano();
    $("pushCard").outerHTML = htmlPush();
  } catch (e) { nota.className = "nota mal"; nota.textContent = e.message; }
}

async function probarPush() {
  const nota = $("pushNota"); nota.className = "nota"; nota.textContent = "Enviando…";
  try { const r = await api("probarPush"); nota.className = "nota ok"; nota.textContent = r.enviados + " aviso(s) enviado(s)."; }
  catch (e) { nota.className = "nota mal"; nota.textContent = e.message; }
}

// Con la app abierta Firebase no muestra nada solo: hay que mostrar el aviso a mano.
let escuchando = false;
function escucharEnPrimerPlano() {
  if (escuchando || typeof firebase === "undefined") return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    firebase.messaging().onMessage((p) => navigator.serviceWorker.ready.then((r) =>
      r.showNotification((p.notification && p.notification.title) || "Finanzas", { body: (p.notification && p.notification.body) || "", icon: "icon-192.png" })));
    escuchando = true;
  } catch (e) {}
}
if (pushActivo()) escucharEnPrimerPlano();

// ---- Objetivo: ahorro proyectado a 12 meses contra la meta (20% del ingreso) ----
let objIdx = null, objTodos = [];
const pct = (x) => (x * 100).toFixed(1).replace(".", ",") + "%";

function htmlObjetivo(d) {
  const meses = d.meses;
  objTodos = (d.pasados || []).concat(meses);
  if (objIdx === null) objIdx = (d.pasados || []).length;
  const meta = meses.reduce((s, m) => s + m.meta, 0), acum = meses.reduce((s, m) => s + m.resultado, 0);
  const cumplen = meses.filter(m => m.vsMeta >= 0).length;
  const pctTotal = meta ? acum / meta : 0, dif = acum - meta;
  const color = pctTotal >= 1 ? "var(--green)" : pctTotal >= 0.6 ? "var(--sand)" : "var(--rose)";
  const cerrados = d.pasados || [];
  const real = cerrados.length ? `<div class="row"><span>Meses ya cerrados (${cerrados.length})</span><span>${money(cerrados.reduce((s, m) => s + m.resultado, 0))} de ${money(cerrados.reduce((s, m) => s + m.meta, 0))}</span></div>` : "";
  return `
    <div class="big" style="background:${color}"><small>Ahorro proyectado a 12 meses</small><b>${money(acum)}</b></div>
    <div class="card">
      <div class="row"><span>Objetivo (${pct(0.2)} del ingreso)</span><span>${money(meta)}</span></div>
      <div class="hbar" style="height:12px;margin:6px 0 10px"><i style="width:${Math.max(0, Math.min(100, pctTotal * 100))}%"></i></div>
      <div class="row"><span>Avance</span><span><b>${pct(pctTotal)}</b></span></div>
      <div class="row"><span>${dif >= 0 ? "Por encima del objetivo" : "Falta para el objetivo"}</span><span style="color:${dif >= 0 ? "var(--ok)" : "var(--bad)"}">${money(Math.abs(dif))}</span></div>
      <div class="row"><span>Meses que llegan a la meta</span><span>${cumplen} de ${meses.length}</span></div>
      ${real}
    </div>
    <h2>Mes por mes</h2>
    <div id="objMes">${htmlObjMes()}</div>
    <div class="vacio" style="text-align:left">Proyección con lo ya comprometido (fijos, cuotas y consumos cargados). No incluye gastos que todavía no cargaste. Cada mes se congela al terminar.</div>`;
}

function htmlObjMes() {
  const m = objTodos[objIdx];
  const chips = objTodos.map((x, i) => `<button class="chip ${i === objIdx ? "on" : ""} ${x.estado}" onclick="selObj(${i})">${x.label}</button>`).join("");
  const estado = m.estado === "cerrado" ? "Cerrado" : m.estado === "actual" ? "En curso" : "Proyectado";
  const sec = m.secciones.map(sc => `<div class="sec"><span>${esc(sc.titulo)}</span><span>${money(sc.total)}</span></div>` +
    sc.items.map(it => `<div class="sub"><span>${esc(it.nombre)}${it.nota ? ` <small>· ${esc(it.nota)}</small>` : ""}</span><span>${money(it.monto)}</span></div>`).join("")).join("");
  const ok = m.vsMeta >= 0;
  return `<div class="chips" id="chips">${chips}</div>
    <div class="card" id="objCard" ontouchstart="tocarObj(event)" ontouchend="tocarObj(event)">
      <div class="nav-mes" style="margin-bottom:6px"><button class="mini" onclick="selObj(${objIdx - 1})" ${objIdx <= 0 ? "disabled" : ""}>‹</button>
        <b>${m.labelLargo}<span class="tag">${estado}</span></b>
        <button class="mini" onclick="selObj(${objIdx + 1})" ${objIdx >= objTodos.length - 1 ? "disabled" : ""}>›</button></div>
      <div class="row"><span><b>Ingreso</b> <small>(facturado el mes anterior)</small></span><span><b>${money(m.ingreso)}</b></span></div>
      ${sec}
      <div class="sec"><span>Total a pagar</span><span>${money(m.total)}</span></div>
      <div class="sec"><span>Te queda</span><span style="color:${m.resultado >= 0 ? "var(--ok)" : "var(--bad)"}">${money(m.resultado)}</span></div>
      <div class="row"><span>Meta de ahorro (${pct(0.2)} del ingreso)</span><span>${money(m.meta)}</span></div>
      <div class="row"><span>${ok ? "Superás la meta por" : "Te faltan para la meta"}</span><span style="color:${ok ? "var(--ok)" : "var(--bad)"}">${money(Math.abs(m.vsMeta))}</span></div>
    </div>`;
}

function selObj(i) {
  if (i < 0 || i >= objTodos.length) return;
  objIdx = i; $("objMes").innerHTML = htmlObjMes();
  const c = document.querySelector("#chips .chip.on"); if (c) c.scrollIntoView({ inline: "center", block: "nearest" });
}
let tocX = null;
function tocarObj(e) {
  if (e.type === "touchstart") { tocX = e.touches[0].clientX; return; }
  if (tocX === null) return;
  const dx = e.changedTouches[0].clientX - tocX; tocX = null;
  if (Math.abs(dx) > 60) selObj(objIdx + (dx < 0 ? 1 : -1));
}

let mesSel = 0;

function htmlDeuda(d) {
  const bruto = (m) => m.secciones.filter(sc => sc.tipo === "cuotas" && sc.titulo !== "Descuento de alquiler").reduce((a, sc) => a + sc.total, 0);
  const max = Math.max(1, ...d.meses.map(bruto));
  const filas = d.meses.map(m => `<div class="mes" style="grid-template-columns:52px 1fr 92px;cursor:default"><span>${m.label}</span>
    <div class="hbar"><i style="width:${Math.max(2, bruto(m) / max * 100)}%"></i></div><span>${money(bruto(m))}</span></div>`).join("");
  const grupos = {};
  d.cuotas.forEach(c => { const t = c.tarjeta || "Sin tarjeta"; (grupos[t] = grupos[t] || []).push(c); });

    grupos[t].map(c => `<div class="sub"><span>${esc(c.concepto)} <small>· quedan ${c.restantes}${c.empieza ? ", empieza en " + c.empieza : ""}, termina en ${c.termina}</small></span><span>${money(c.monto)}</span></div>`).join("")).join("") || `<div class="vacio">Sin cuotas</div>`;

    <h2>Lo que pagás de cuotas cada mes</h2>
    <div class="card">${filas}<div class="vacio" style="text-align:left;padding-bottom:0">Cuotas y préstamo, sin descuentos. Baja a medida que terminan.</div></div>

const TARJETAS = ["Banco Ciudad", "Mercado Pago"];
const OBLIGACIONES = ["Movistar", "Luz", "Gas", "Agua", "Universidad", "Monotributo", "Préstamo", "Tarjeta Banco Ciudad", "Tarjeta Mercado Pago"];
let tipoCarga = "cuotas";
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

function htmlCargar() {
  const t = tipoCarga, cuotas = t === "cuotas", fac = t === "factura";
  const btn = (k, txt) => `<button class="${t === k ? "on" : ""}" onclick="setTipo('${k}')">${txt}</button>`;
  return `
    <div class="seg">${btn("cuotas", "En cuotas")}${btn("unico", "Un pago")}${btn("factura", "Factura")}</div>
    <div class="card">
      <div class="campo"><label>Concepto</label><input id="cConcepto" type="text" autocomplete="off" ${fac ? 'list="obligaciones"' : ""} placeholder="${fac ? "Ej: Luz" : "Ej: Zapatillas"}"></div>
      ${fac ? `<datalist id="obligaciones">${OBLIGACIONES.map(o => `<option value="${o}">`).join("")}</datalist>` : ""}
      <div class="campo"><label>${cuotas ? "Monto de la cuota" : fac ? "Monto a pagar" : "Monto"}</label><input id="cMonto" type="text" inputmode="decimal" autocomplete="off" placeholder="0" oninput="previa()"></div>
      ${cuotas ? `<div class="campo"><label>Cantidad de cuotas</label><input id="cCuotas" type="number" inputmode="numeric" min="2" max="36" placeholder="Ej: 6" oninput="previa()"></div>` : ""}
      ${fac ? `<div class="campo"><label>Vencimiento</label><input id="cVto" type="date" onchange="previa()"></div>`
            : `<div class="campo"><label>Tarjeta</label><select id="cTarjeta">${TARJETAS.map(x => `<option>${x}</option>`).join("")}</select></div>`}
    </div>
    ${fac ? "" : `<label class="tilde"><input type="checkbox" id="cSig" onchange="previa()"><span>Siguiente resumen<small>Marcalo si el consumo fue después del cierre de la tarjeta: se empieza a pagar un mes más tarde.</small></span></label>`}
    <div class="nota" id="cNota"></div>
    <button class="btn" id="cBtn" onclick="enviarCarga()">Guardar</button>
    <label class="btn btn2" for="cFoto">Leer desde foto</label>
    <input type="file" id="cFoto" accept="image/*" class="hidden" onchange="leerFoto(this)">
    <div id="cItems"></div>`;
}

function setTipo(t) { tipoCarga = t; $("vista").innerHTML = htmlCargar(); }

// Acepta "45833", "45.833" o "45.833,50".
// Acepta "45833", "45.833", "45.833,50", "16600.63" y "16600,63". Con coma, la coma son los decimales;
// sin coma, un punto con 3 dígitos detrás es separador de miles y cualquier otro punto es decimal.
function leerMonto(txt) {
  let t = String(txt || "").replace(/[$\s]/g, "");
  if (t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  return Number(t);
}
const money2 = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(Number(n || 0)).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function mesPago(sig) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (sig ? 2 : 1)); return d.toLocaleDateString("es-AR", { month: "long", year: "numeric" }); }
function fechaCorta(iso) { const [a, m, d] = String(iso).split("-"); return `${d}/${m}`; }

function previa() {
  const m = leerMonto($("cMonto").value);
  const n = $("cCuotas") ? Number($("cCuotas").value) : 0;
  $("cNota").className = "nota";
  const sig = $("cSig") ? $("cSig").checked : false;
  const partes = [];
  if (m > 0) partes.push(tipoCarga === "cuotas" && n >= 2 ? `${n} cuotas de ${money2(m)} · total ${money2(m * n)}` : money2(m));
  if (tipoCarga !== "factura") partes.push(`se paga por primera vez en ${mesPago(sig)}`);
  $("cNota").textContent = partes.join(" · ");
}

async function enviarCarga() {
  const nota = $("cNota"), btn = $("cBtn"), fac = tipoCarga === "factura";
  const datos = { tipo: tipoCarga, concepto: $("cConcepto").value.trim(), monto: leerMonto($("cMonto").value),
    tarjeta: $("cTarjeta") ? $("cTarjeta").value : "", cuotas: $("cCuotas") ? Number($("cCuotas").value) : 1,
    vencimiento: $("cVto") ? $("cVto").value : "", siguiente: $("cSig") ? $("cSig").checked : false };
  const falta = !datos.concepto || !(datos.monto > 0) || (tipoCarga === "cuotas" && !(datos.cuotas >= 2)) || (fac && !datos.vencimiento);
  if (falta) { nota.className = "nota mal"; nota.textContent = "Completá todos los campos."; return; }
  btn.disabled = true; nota.className = "nota"; nota.textContent = "Guardando…";
  try {
    const r = await api(fac ? "cargarFactura" : "cargar", datos);
    $("vista").innerHTML = htmlCargar();
    $("cNota").className = "nota ok";
    $("cNota").textContent = fac ? `Guardado: ${datos.concepto} · ${money(datos.monto)} · rescate ${fechaCorta(r.rescate)}, pago ${fechaCorta(r.pago)}`
      : `Guardado: ${datos.concepto} · ${money2(datos.monto)}${tipoCarga === "cuotas" ? " × " + datos.cuotas : ""} · se paga desde ${mesPago(datos.siguiente)}`;
  } catch (e) { nota.className = "nota mal"; nota.textContent = e.message; btn.disabled = false; }
}

// Reduce la foto antes de enviarla (más rápido y más liviano).
function reducirImagen(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = () => rej(new Error("No pude abrir la imagen"));
    img.src = url;
  });
}

let modoItems = "consumo";
async function leerFoto(inp) {
  const f = inp.files[0]; if (!f) return;
  const nota = $("cNota"); nota.className = "nota"; nota.textContent = "Leyendo comprobante…";
  try {
    const imagen = await reducirImagen(f);
    const r = await api("leerFoto", { imagen, modo: tipoCarga === "factura" ? "factura" : "consumo" });
    modoItems = r.modo;
    nota.textContent = `Encontré ${r.items.length} ${modoItems === "factura" ? "factura(s)" : "consumo(s)"}. Revisá y guardá cada una.`;
    $("cItems").innerHTML = r.items.map((p, i) => htmlItem(p, i)).join("");
  } catch (e) { nota.className = "nota mal"; nota.textContent = e.message; }
  inp.value = "";
}

function htmlItem(p, i) {
  const fac = modoItems === "factura";
  const campos = fac ? `
    <div class="fila">
      <div class="campo"><label>Monto</label><input id="iM${i}" type="text" inputmode="decimal" value="${p.monto}" oninput="$('iE${i}').textContent = money2(leerMonto(this.value))"></div>
      <div class="campo"><label>Vencimiento</label><input id="iV${i}" type="date" value="${p.vencimiento}"></div>
    </div>` : `
    <div class="fila">
      <div class="campo"><label>Monto cuota</label><input id="iM${i}" type="text" inputmode="decimal" value="${p.monto}" oninput="$('iE${i}').textContent = money2(leerMonto(this.value))"></div>
      <div class="campo"><label>Cuotas</label><input id="iN${i}" type="number" inputmode="numeric" min="1" max="36" value="${p.cuotas}"></div>
    </div>
    <div class="campo"><label>Tarjeta</label><select id="iT${i}"><option value="">Elegir…</option>${TARJETAS.map(t => `<option ${t === p.tarjeta ? "selected" : ""}>${t}</option>`).join("")}</select></div>`;
  return `<div class="item" id="it${i}">
    <div class="campo"><label>Concepto</label><input id="iC${i}" type="text" value="${esc(p.concepto)}"></div>
    ${campos}
    <div class="nota" id="iE${i}" style="margin-bottom:4px">${money2(p.monto)}</div>
    ${fac ? "" : `<label class="tilde"><input type="checkbox" id="iS${i}"><span>Siguiente resumen<small>Después del cierre de la tarjeta: se paga un mes más tarde.</small></span></label>`}
    <div class="nota" id="iNota${i}"></div>
    <div class="acc"><button class="descartar" onclick="descartar(${i})">Descartar</button><button class="guardar" id="iG${i}" onclick="guardarItem(${i})">Guardar</button></div>
  </div>`;
}

function descartar(i) { $("it" + i).remove(); }

async function guardarItem(i) {
  const fac = modoItems === "factura", nota = $("iNota" + i), btn = $("iG" + i);
  const n = fac ? 1 : Number($("iN" + i).value);
  const datos = { tipo: n >= 2 ? "cuotas" : "unico", concepto: $("iC" + i).value.trim(), monto: leerMonto($("iM" + i).value), cuotas: n,
    tarjeta: fac ? "" : $("iT" + i).value, vencimiento: fac ? $("iV" + i).value : "", siguiente: fac ? false : $("iS" + i).checked };
  if (!datos.concepto || !(datos.monto > 0) || (fac ? !datos.vencimiento : !datos.tarjeta)) {
    nota.className = "nota mal"; nota.textContent = "Completá todos los campos."; return;
  }
  btn.disabled = true; nota.className = "nota"; nota.textContent = "Guardando…";
  try {
    const r = await api(fac ? "cargarFactura" : "cargar", datos);
    const el = $("it" + i); el.classList.add("hecho");
    el.innerHTML = `<div class="nota ok" style="margin:0">Guardado: ${esc(datos.concepto)} · ${money2(datos.monto)}${fac ? " · rescate " + fechaCorta(r.rescate) : (n >= 2 ? " × " + n : "") + " · se paga desde " + mesPago(datos.siguiente)}</div>`;
  } catch (e) { nota.className = "nota mal"; nota.textContent = e.message; btn.disabled = false; }
}


// ---- Facturación (horas) ----
let horasMes = "", horasData = null, diaAbierto = "";
const hh = (n) => (Math.round(n * 100) / 100).toLocaleString("es-AR");
const dmy = (f) => f.slice(8) + "/" + f.slice(5, 7);

async function cargarHoras(mes) {
  const d = await api("facturacion", mes ? { mes } : {});
  mostrarHoras(d);
}
function mostrarHoras(d) {
  horasData = d; horasMes = d.mes; diaAbierto = "";
  $("vista").innerHTML = htmlHoras(d);
}
function mesVecino(mes, n) {
  const x = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)) - 1 + n, 1);
  return x.getFullYear() + "-" + ("0" + (x.getMonth() + 1)).slice(-2);
}
function irMes(n) { cargarHoras(mesVecino(horasMes, n)).catch(e => alert(e.message)); }

function htmlHoras(d) {
  const v = d.valores || {};
  const fila = (t, c, x) => `<div class="row"><span>${t}${x && x.desde ? ` <small>(desde ${dmy(x.desde)})</small>` : ""}</span><span>${money(x ? x.valor : 0)} <button class="mini" onclick="editarValor('${c}')">Cambiar</button></span></div>`;
  return `
  <div class="nav-mes"><button class="mini" onclick="irMes(-1)">‹</button><b>${d.label}</b><button class="mini" onclick="irMes(1)">›</button></div>
  <div class="big pos"><small>Total a facturar · se cobra en ${d.cobra}</small><b>${money(d.total)}</b></div>
  <div class="card">
    <div class="row"><span>Horas</span><span>${hh(d.horas)} hs</span></div>
    <div class="row"><span>Horas × valor hora</span><span>${money(d.montoHoras)}</span></div>
    <div class="row"><span>Monotributo</span><span>${money(d.monotributo)}</span></div>
    <div class="row"><span>Obra social / prepaga</span><span>${money(d.obraSocial)}</span></div>
  </div>
  <h2>Valores vigentes</h2>
  <div class="card">
    ${fila("Valor hora", "valorHora", v.valorHora)}
    ${fila("Monotributo", "monotributo", v.monotributo)}
    ${fila("Obra social", "obraSocial", v.obraSocial)}
    <div class="nota" id="notaVal"></div>
  </div>
  <h2>Días</h2>
  <div class="card">${d.dias.map(htmlDia).join("")}</div>
  <button class="btn btn2" onclick="imprimirHoras()">Imprimir resumen (A4)</button>`;
}

function htmlDia(x) {
  const libre = !x.entrada && !x.ho;
  const detalle = libre ? "Sin horas" : (x.entrada ? `${x.entrada} – ${x.salida}` : "") + (x.ho ? `${x.entrada ? " · " : ""}HO ${hh(x.ho)} hs` : "");
  const marca = (x.feriado ? " · feriado" : "") + (x.editado ? " · modificado" : "");
  return `<div id="d${x.fecha}"><div class="dia ${x.finde ? "finde" : ""} ${libre ? "libre" : ""}" onclick="abrirDia('${x.fecha}')">
    <span><b>${x.dia}</b> ${x.num}</span><span>${detalle}<small>${marca.replace(/^ · /, "")}</small></span><span>${libre ? "" : hh(x.total) + " hs"}</span></div></div>`;
}

function abrirDia(f) {
  if (diaAbierto) { const prev = diaAbierto; diaAbierto = ""; const px = horasData.dias.find(z => z.fecha === prev); if (px) $("d" + prev).innerHTML = htmlDia(px).replace(/^<div id="d[^"]*">|<\/div>$/g, ""); }
  if (diaAbierto === f) return;
  const x = horasData.dias.find(z => z.fecha === f); diaAbierto = f;
  $("d" + f).innerHTML = `<div class="edit-dia">
    <b>${x.dia} ${dmy(f)}</b>
    <div class="fila" style="display:flex;gap:8px;margin-top:8px">
      <div class="campo" style="flex:1"><label>Entrada</label><input id="eE" type="time" value="${x.entrada}"></div>
      <div class="campo" style="flex:1"><label>Salida</label><input id="eS" type="time" value="${x.salida}"></div>
      <div class="campo" style="flex:1"><label>Home office</label><input id="eH" type="number" min="0" max="24" step="0.5" inputmode="decimal" value="${x.ho}"></div>
    </div>
    <div class="nota" id="eN"></div>
    <div class="acc">
      <button class="mini ir" onclick="guardarDia('${f}')">Guardar</button>
      <button class="mini" onclick="diaLibre('${f}')">Día libre</button>
      ${x.editado ? `<button class="mini" onclick="restablecerDia('${f}')">Restablecer</button>` : ""}
      <button class="mini" onclick="mostrarHoras(horasData)">Cancelar</button>
    </div></div>`;
}

async function enviarDia(f, datos, texto) {
  if (!confirm(texto)) return;
  try { mostrarHoras(await api("guardarJornada", Object.assign({ fecha: f }, datos))); }
  catch (e) { const n = $("eN"); if (n) { n.className = "nota mal"; n.textContent = e.message; } else alert(e.message); }
}
function guardarDia(f) {
  const e = $("eE").value, s = $("eS").value, h = Number($("eH").value) || 0;
  enviarDia(f, { entrada: e, salida: s, ho: h }, `¿Guardar ${dmy(f)}: ${e && s ? e + " a " + s : "sin oficina"}${h ? ", home office " + h + " hs" : ""}?`);
}
function diaLibre(f) { enviarDia(f, { entrada: "", salida: "", ho: 0 }, `¿Marcar ${dmy(f)} como día sin horas?`); }
function restablecerDia(f) { enviarDia(f, { restablecer: true }, `¿Volver ${dmy(f)} al horario habitual?`); }

const NOMBRE_VAL = { valorHora: "valor hora", monotributo: "monotributo", obraSocial: "obra social" };
async function editarValor(c) {
  const actual = horasData.valores[c];
  const t = prompt(`Nuevo ${NOMBRE_VAL[c]} (actual ${actual ? money(actual.valor) : "sin cargar"}):`, actual ? actual.valor : "");
  if (t === null) return;
  const valor = leerMonto(t);
  if (!(valor > 0)) { alert("Valor inválido"); return; }
  const hoy = new Date(), iso = hoy.getFullYear() + "-" + ("0" + (hoy.getMonth() + 1)).slice(-2) + "-" + ("0" + hoy.getDate()).slice(-2);
  const desde = prompt("¿Desde qué fecha rige? (AAAA-MM-DD)", iso);
  if (!desde || !/^\d{4}-\d{2}-\d{2}$/.test(desde)) { alert("Fecha inválida"); return; }
  if (!confirm(`¿Guardar ${NOMBRE_VAL[c]} ${money(valor)} desde ${dmy(desde)}?`)) return;
  try { mostrarHoras(await api("guardarValores", { concepto: c, desde, valor, mes: horasMes })); }
  catch (e) { alert(e.message); }
}

function imprimirHoras() {
  const d = horasData;
  const filas = d.dias.filter(x => x.entrada || x.ho).map(x =>
    `<tr><td>${x.dia} ${x.num}/${x.fecha.slice(5, 7)}</td><td>${x.entrada || "-"}</td><td>${x.salida || "-"}</td><td>${hh(x.pres)}</td><td>${hh(x.ho)}</td><td>${hh(x.total)}</td><td>${money(x.valorHora)}</td><td>${money(x.monto)}</td></tr>`).join("");
  $("impresion").innerHTML = `<h1>Resumen de horas · ${d.label}</h1>
    <table><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Hs oficina</th><th>Hs home office</th><th>Total hs</th><th>Valor hora</th><th>Monto</th></tr>${filas}
    <tr><th colspan="5">Total horas</th><th>${hh(d.horas)}</th><th>Subtotal</th><th>${money(d.montoHoras)}</th></tr></table>
    <p>Cuota monotributo: ${money(d.monotributo)}<br>Medicina prepaga: ${money(d.obraSocial)}<br><b>TOTAL FACTURA: ${money(d.total)}</b></p>`;
  window.print();
}

$("salir").addEventListener("click", () => { try { sessionStorage.removeItem("k"); } catch (e) {} clave = null; mostrarLogin(); });
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => cargar(b.dataset.v).catch(e => mostrarLogin(e.message))));

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

if (k) entrar(k); else mostrarLogin();
